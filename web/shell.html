<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so the canvas can use the whole screen on notched
       phones. maximum-scale/user-scalable stop the browser zooming the page
       out from under the game when a finger lands twice. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CASHYPHUS</title>
  <style>
    /* The game renders a 180x360 portrait frame and letterboxes it INSIDE the
       canvas, so the page must never impose a shape of its own on the canvas.
       It used to: a portrait CSS box on a canvas whose backing store raylib
       resizes to the whole window on every resize (EmscriptenResizeCallback in
       rcore_web.c) means the browser stretches one into the other -- the game
       came out about a third of its proper width and squashed, and clicks
       landed in the wrong place. The box is now locked to the backing store by
       script below, with one scale factor, which cannot distort anything. The
       rest of this exists to stop a mobile browser fighting the game: no
       scroll, no pinch zoom, no pull-to-refresh, no long-press callout. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0a0e;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Size comes from fitCanvas() below: the canvas is shown at its own pixel
       size, scaled down by ONE factor if the viewport is smaller.

       Deliberately no max-width/max-height here. Those are single-axis clamps,
       and any single-axis clamp breaks an aspect ratio the moment it bites: on a
       phone the URL bar changes the LAYOUT viewport height without touching the
       canvas, so max-height threw away the height the script had just set and
       squashed the game by ~18% until the bar came back. The script keeps the
       box inside the layout box instead, which cannot distort anything. */
    canvas.emscripten {
      display: block;
      border: 0;
      background: #0b0a0e;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      outline: none;
    }

    /* Loading and failure share this panel. A silent blank page is the worst
       failure mode a wasm build can have, so anything that goes wrong prints
       here instead of nowhere. */
    #panel {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      box-sizing: border-box;
      color: #e8e4d8;
      text-align: center;
      background: #0b0a0e;
      z-index: 10;
    }
    #panel.hidden { display: none; }
    #panel h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.35em;
      font-weight: 600;
      color: #ffd98a;
    }
    #panel p { margin: 0; font-size: 13px; line-height: 1.6; color: #8a877e; max-width: 34em; }
    #panel .err {
      color: #ff9a8a;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 40vh;
      overflow: auto;
      text-align: left;
      background: #17141c;
      padding: 10px 12px;
      border-radius: 6px;
      max-width: 60em;
      width: 100%;
    }
    #start {
      appearance: none;
      border: 1px solid #3a3546;
      background: #17141c;
      color: #ffd98a;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.2em;
      padding: 12px 22px;
      border-radius: 6px;
      cursor: pointer;
    }
    #start:active { background: #221d2b; }
    #start:disabled { opacity: 0.45; cursor: default; }

    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(6px, env(safe-area-inset-bottom));
      text-align: center;
      color: #6f6b64;
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      z-index: 5;
    }
    #sound {
      position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px;
      z-index: 6; background: #221d2b; color: #e7d59b; border: 1px solid #8b7b55;
      font: 10px monospace; padding: 7px; cursor: pointer;
    }
    #hint .touch { display: none; }
    @media (hover: none) and (pointer: coarse) {
      #hint .touch { display: inline; }
      #hint .kb { display: none; }
    }
  </style>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="hint">
    <span class="kb">LEFT CLICK push &middot; HOLD RIGHT CLICK brace<br>
      SPACE / SHIFT also work &middot; M mute &middot; [ / ] volume &middot; F fullscreen</span>
    <span class="touch">tap = PUSH or STAY &middot; hold = BRACE or LEAVE</span>
  </div>

  <button id="sound" type="button" aria-label="Mute audio">SOUND ON</button>

  <div id="panel">
    <h1>CASHYPHUS</h1>
    <p>One hill. One lifetime. One more push.</p>
    <button id="start" type="button">TAP TO PLAY</button>
    <p id="status">loading engine&hellip;</p>
  </div>

  <script>
    var panel    = document.getElementById('panel');
    var statusEl = document.getElementById('status');
    var canvas   = document.getElementById('canvas');
    var logTail  = [];

    // The start button stays dead until the engine is up. Letting it hide the
    // panel early would swallow the first press, which is the one that has to
    // leave the title screen.
    var ready    = false;
    var startBtn = document.getElementById('start');
    if (startBtn) startBtn.disabled = true;

    function hidePanel() { if (panel) panel.classList.add('hidden'); }
    function panelVisible() { return panel && !panel.classList.contains('hidden'); }

    // --- keep the display size equal to the canvas's own pixel size ----------
    // raylib's web backend resizes the canvas ELEMENT to window.innerWidth x
    // innerHeight on every window resize (EmscriptenResizeCallback), while the
    // game draws a 180x360 portrait frame letterboxed inside it. If the CSS box
    // is anything other than the backing store, the browser stretches one into
    // the other: a portrait box made the game come out roughly a third of its
    // proper width and squashed, with clicks landing in the wrong place.
    //
    // Two rules make that impossible:
    //   * one scale factor, capped at 1, so the pixels are never stretched or
    //     blown up;
    //   * fit the LAYOUT box, not the visual one. On a phone the URL bar changes
    //     the layout viewport height while the canvas keeps its pixel size, so
    //     measuring against the larger of the two overflows -- and with a
    //     single-axis clamp in the stylesheet, overflow is a squash.
    //
    // Polled rather than bound to the resize event, because neither the handler
    // order against raylib's own resize nor the arrival of visualViewport
    // changes is guaranteed.
    var fitW = 0, fitH = 0, fitVW = 0, fitVH = 0;
    function fitCanvas() {
      if (!canvas || !canvas.width || !canvas.height) return;
      var w = canvas.width, h = canvas.height;
      // The body is the box the canvas actually has to live in (it is the flex
      // container), so it gets the final say. A dimension that reports 0 is
      // ignored rather than treated as zero.
      var de = document.documentElement || {}, bd = document.body || {};
      var availW = Math.min(window.innerWidth  || w, de.clientWidth  || w, bd.clientWidth  || w);
      var availH = Math.min(window.innerHeight || h, de.clientHeight || h, bd.clientHeight || h);
      if (w === fitW && h === fitH && availW === fitVW && availH === fitVH) return;
      fitW = w; fitH = h; fitVW = availW; fitVH = availH;
      var s = Math.min(availW / w, availH / h);
      if (!isFinite(s) || s <= 0) s = 1;
      canvas.style.width  = Math.round(w * s) + 'px';
      canvas.style.height = Math.round(h * s) + 'px';
    }
    function keepCanvasFitted() {
      fitCanvas();
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(keepCanvasFitted);
    }
    keepCanvasFitted();

    function showError(msg) {
      if (!panel) return;
      panel.classList.remove('hidden');
      var old = panel.querySelector('.err');
      if (old) old.remove();
      var box = document.createElement('div');
      box.className = 'err';
      box.textContent = String(msg);
      panel.appendChild(box);
      if (logTail.length) {
        var log = document.createElement('div');
        log.className = 'err';
        log.textContent = logTail.join('\n');
        panel.appendChild(log);
      }
    }

    // A blank page is the worst possible failure for a wasm build, so anything
    // that throws, rejects, or aborts prints into the panel instead of nowhere.
    window.addEventListener('error', function (e) {
      showError('Runtime error: ' + (e.message || e.error || e.type));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      showError('Load failed: ' + (r && r.message ? r.message : r));
    });

    // Name of the wasm this page is allowed to load. The staging step
    // rewrites this to a content-hashed name, which is what stops a cached
    // cashyphus.js from being paired with a wasm it was never built against.
    var CASHYPHUS_WASM = 'cashyphus.wasm';

    // Defined before the loader script below so the runtime picks it up.
    //
    // `canvas` is not optional: Emscripten's GLFW init does
    // Module["canvas"].addEventListener(...), and without it that throws, main()
    // never runs, and the page shows a black canvas with no error anywhere.
    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function (path, prefix) {
        var p = prefix || '';
        if (path === 'cashyphus.wasm') return p + CASHYPHUS_WASM;
        return p + path;
      },
      onRuntimeInitialized: function () {
        ready = true;
        if (statusEl) statusEl.textContent = 'ready';
        if (startBtn) { startBtn.disabled = false; startBtn.textContent = 'TAP TO PLAY'; }
      },
      onAbort: function (what) {
        showError('Aborted: ' + what);
      },
      printErr: function (line) {
        // Kept only for the failure report; raylib is chatty at INFO level.
        logTail.push(String(line));
        if (logTail.length > 40) logTail.shift();
      }
    };

    // If the runtime never arrives, say so rather than spinning for ever --
    // usually a 404 on the .wasm or a MIME-type problem.
    setTimeout(function () {
      if (statusEl && statusEl.textContent.indexOf('ready') === -1) {
        showError('The engine did not start within 25s.\n' +
                  'Check that cashyphus.wasm is being served next to this page ' +
                  'and that the server returns application/wasm for it.');
      }
    }, 25000);

    // --- audio unlock -------------------------------------------------------
    // Phone browsers create the WebAudio context suspended and only let it run
    // once it has been resumed from inside a real user gesture. The game never
    // asks (raylib just opens the device at startup), so the first tap has to
    // do it. raylib's audio (miniaudio) keeps the context on
    // window.miniaudio.devices[].webaudio; resuming a running context is a
    // no-op, so this is safe to call on every gesture.
    function unlockAudio() {
      try {
        var ma = window.miniaudio;
        if (!ma || !ma.devices) return;
        for (var i = 0; i < ma.devices.length; ++i) {
          var d = ma.devices[i];
          if (d && d.webaudio && d.webaudio.state !== 'running' && d.webaudio.resume) {
            var p = d.webaudio.resume();
            if (p && p.catch) p.catch(function () {});
          }
        }
      } catch (e) { /* audio is a nicety, never a hard failure */ }
    }

    ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, unlockAudio, { passive: true });
    });

    // --- touch -> the game's two keys --------------------------------------
    // The game already reads SPACE (push) and SHIFT (brace) as ordinary key
    // state, so touch is translated into those keys rather than adding a second
    // input path inside the engine. window is where Emscripten's keyboard
    // listener lives.
    var KEY_SPACE = { code: 'Space',     keyCode: 32 };
    var KEY_SHIFT = { code: 'ShiftLeft', keyCode: 16 };
    var KEY_M = { code: 'KeyM', keyCode: 77 };

    function sendKey(type, k) {
      var ev = new KeyboardEvent(type, { code: k.code, key: k.code, bubbles: true, cancelable: true });
      try {
        Object.defineProperty(ev, 'keyCode', { get: function () { return k.keyCode; } });
        Object.defineProperty(ev, 'which',   { get: function () { return k.keyCode; } });
      } catch (err) { /* older browsers may ignore this; the code field may do */ }
      window.dispatchEvent(ev);
    }

    var soundBtn = document.getElementById('sound');
    if (soundBtn) {
      ['touchstart', 'touchend', 'touchcancel'].forEach(function (name) {
        soundBtn.addEventListener(name, function (e) { e.stopPropagation(); }, { passive: true });
      });
      soundBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        sendKey('keydown', KEY_M);
        setTimeout(function () { sendKey('keyup', KEY_M); }, TAP_MS);
        var off = soundBtn.textContent === 'SOUND ON';
        soundBtn.textContent = off ? 'SOUND OFF' : 'SOUND ON';
        soundBtn.setAttribute('aria-label', off ? 'Unmute audio' : 'Mute audio');
      });
    }

    // Beyond this a touch is a brace rather than a push.
    var HOLD_MS = 160;
    // A synthetic push has to stay down for at least one frame, or the game
    // never sees the edge: raylib samples key state once per frame, and a
    // keydown plus keyup inside one frame cancel out. 70ms is comfortably
    // longer than a frame at 60Hz.
    var TAP_MS = 70;

    var activeTouch = null;
    var holdTimer = null;
    var braced = false;

    function beginTouch(e) {
      if (activeTouch !== null) return;          // ignore extra fingers
      activeTouch = (e.changedTouches && e.changedTouches[0])
        ? e.changedTouches[0].identifier : 0;
      braced = false;
      holdTimer = setTimeout(function () { braced = true; sendKey('keydown', KEY_SHIFT); }, HOLD_MS);
    }

    function endTouch() {
      if (activeTouch === null) return;
      clearTimeout(holdTimer);
      holdTimer = null;
      if (braced) {
        sendKey('keyup', KEY_SHIFT);
      } else {
        sendKey('keydown', KEY_SPACE);
        setTimeout(function () { sendKey('keyup', KEY_SPACE); }, TAP_MS);
      }
      braced = false;
      activeTouch = null;
    }

    // Bound to the document, not the canvas, so the letterboxed bars and the
    // area around a phone's notch are still part of the control surface.
    document.addEventListener('touchstart', function (e) {
      if (panelVisible()) return;                // the start button owns this
      // Stops the browser inventing a mouse press from this touch, which would
      // otherwise drive the game's mouse handling a second time.
      e.preventDefault();
      beginTouch(e);
    }, { passive: false });

    document.addEventListener('touchend', function (e) {
      if (panelVisible()) return;
      e.preventDefault();
      endTouch();
    }, { passive: false });

    document.addEventListener('touchcancel', function (e) {
      if (panelVisible()) return;
      e.preventDefault();
      endTouch();
    }, { passive: false });

    // --- mouse -> the engine, with the release guaranteed -------------------
    // Left-click (push) and a HELD right-click (brace) are the desktop controls.
    // Emscripten's GLFW attaches its mouse listeners to the canvas and relied on
    // Element.setCapture() to keep receiving a pressed button; setCapture() no
    // longer exists in modern browsers, so a right-click released over a
    // letterbox bar would never reach the engine -- and the game polls that
    // button every frame, so it would read as a brace that is stuck on for ever.
    // Re-dispatch the release to the canvas whenever it lands anywhere else.
    if (canvas && canvas.dispatchEvent && typeof MouseEvent === 'function') {
      document.addEventListener('mouseup', function (e) {
        if (panelVisible() || e.target === canvas) return;   // the canvas got it
        canvas.dispatchEvent(new MouseEvent('mouseup', {
          bubbles: false,            // non-bubbling, so it cannot re-enter here
          cancelable: true,
          button: e.button,
          buttons: e.buttons,
          clientX: e.clientX,
          clientY: e.clientY,
        }));
      }, true);
    }

    // Right-click is a control now, so the browser's context menu must not
    // interrupt it mid-brace. The loading / failure panel keeps its own.
    document.addEventListener('contextmenu', function (e) {
      if (panelVisible()) return;
      e.preventDefault();
    });

    function goFullscreen() {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!fn) return;
      try {
        var p = fn.call(el);
        if (p && p.catch) p.catch(function () {});
      } catch (err) { /* iOS Safari refuses; not worth surfacing */ }
      // The game is a 1:2 PORTRAIT composition (see VIRTUAL_W/VIRTUAL_H), so
      // fullscreen has to stay portrait: asking for landscape rotates the canvas
      // away from the layout it was built for.
      if (screen.orientation && screen.orientation.lock) {
        try {
          var q = screen.orientation.lock('portrait');
          if (q && q.catch) q.catch(function () {});
        } catch (err) { /* desktop and iOS both refuse */ }
      }
    }

    if (startBtn) {
      startBtn.addEventListener('click', function () {
        if (!ready) return;      // cannot normally happen: the button is disabled
        hidePanel();
        // This tap is the user gesture the browser demands before it will let
        // WebAudio run, so unlock it here -- the gesture listeners above are
        // only the fallback.
        unlockAudio();
        // Fullscreen must be requested during the tap or browsers may reject
        // it after transient user activation expires. Its resize can swallow a
        // key sent alongside it, so start the title screen after it settles.
        goFullscreen();
        setTimeout(function () {
          sendKey('keydown', KEY_SPACE);
          setTimeout(function () { sendKey('keyup', KEY_SPACE); }, TAP_MS);
        }, 400);
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'f' || e.key === 'F') goFullscreen();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
